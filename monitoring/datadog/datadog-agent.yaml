apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    # Required in case the Agent cannot resolve the cluster name through IMDS.
    clusterName: <CLUSTER_NAME>
    registry: <PRIVATE_EKS_REGISTRY_PATH>
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
  features:
    apm:
      enabled: true
    logCollection:
      enabled: true
