stages:
  - install
  - test
  - static_analysis
  - security_scan
  - build
  - docker_build
  - image_scan
  - container_test
  - registry
  - health_verify
  - rollback

variables:
  DOCKER_IMAGE: $DOCKERHUB_USER/employee-app
  IMAGE_TAG: v2.0
  APP_DIR: application

cache:
  key: node-modules
  paths:
    - $APP_DIR/node_modules/

default:
  image: node:20-alpine

install_dependencies:
  stage: install
  script:
    - cd $APP_DIR && npm install

run_tests:
  stage: test
  variables:
    MONGO_URI: "mongodb://fake:fake@fake:27017/test"
  script:
    - cd $APP_DIR && npm test

static_analysis:
  stage: static_analysis
  script:
    - cd $APP_DIR && npx eslint .
  allow_failure: true

dependency_scan:
  stage: security_scan
  script:
    - cd $APP_DIR && npm audit --audit-level=high
  allow_failure: true

secret_detection:
  stage: security_scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --no-git
  allow_failure: true

build_application:
  stage: build
  script:
    - cd $APP_DIR && node -c server.js

build_docker_image:
  stage: docker_build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE:$IMAGE_TAG ./$APP_DIR
    - docker save $DOCKER_IMAGE:$IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

image_scan:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 0
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

container_test:
  stage: container_test
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker load -i image.tar
    - docker network create citest-net
    - docker run -d --name test-mongo --network citest-net mongo:6
    - docker run -d --name test-container --network citest-net -e MONGO_URI=mongodb://test-mongo:27017/test -e PORT=3000 $DOCKER_IMAGE:$IMAGE_TAG
    - sleep 10 && docker exec test-container wget -qO- http://localhost:3000/health/ready || (docker logs test-container && exit 1)
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

push_image:
  stage: registry
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker load -i image.tar
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker push $DOCKER_IMAGE:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

health_verification:
  stage: health_verify
  image: argoproj/argocd:latest
  script:
    - argocd login $ARGOCD_SERVER --username $ARGOCD_USER --password $ARGOCD_PASSWORD --insecure
    - argocd app wait employee-app --health --timeout 120
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

rollback_deployment:
  stage: rollback
  image: argoproj/argocd:latest
  script:
    - argocd login $ARGOCD_SERVER --username $ARGOCD_USER --password $ARGOCD_PASSWORD --insecure
    - argocd app rollback employee-app
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'